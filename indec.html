<!doctype html>
<html lang="th" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบริหารจัดการครุภัณฑ์</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body {
      box-sizing: border-box;
      font-family: 'Kanit', sans-serif;
    }
    * {
      font-family: 'Kanit', sans-serif;
    }
    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 500;
    }
    .chart-container {
      position: relative;
      height: 300px;
    }
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: -100%;
        transition: left 0.3s ease;
        z-index: 50;
      }
      .sidebar.open {
        left: 0;
      }
      .chart-container {
        height: 250px;
      }
    }
    .theme-preview {
      height: 60px;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s;
      border: 3px solid transparent;
    }
    .theme-preview:hover {
      transform: scale(1.05);
    }
    .theme-preview.selected {
      border-color: #3b82f6;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .image-preview {
      max-width: 200px;
      max-height: 200px;
      object-fit: cover;
      border-radius: 8px;
    }
    .upload-area {
      border: 2px dashed #cbd5e0;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }
    .upload-area:hover {
      border-color: #3b82f6;
      background-color: #f0f9ff;
    }
    .upload-area.dragover {
      border-color: #3b82f6;
      background-color: #dbeafe;
    }
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .spinner {
      border: 4px solid #f3f4f6;
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

 </head>
 <body class="h-full w-full bg-gray-50">
  <div id="app" class="h-full w-full flex flex-col md:flex-row overflow-hidden"></div>
  <script>
    // Configuration
const defaultConfig = {
  system_name: 'ระบบบริหารจัดการครุภัณฑ์',
  organization_name: 'โรงเรียน/หน่วยงาน',
  logo_url: '',
  primary_color: '#3b82f6',
  secondary_color: '#10b981',
  text_color: '#1f2937',
  accent_color: '#10b981',
  sidebar_color: '#1e40af',
  // เพิ่มบรรทัดนี้
  inspection_menu_enabled: true
};

    let config = { ...defaultConfig };

    // Theme presets
    const themePresets = [
      { name: 'น้ำเงิน-เขียว', primary: '#3b82f6', secondary: '#10b981' },
      { name: 'ม่วง-ชมพู', primary: '#8b5cf6', secondary: '#ec4899' },
      { name: 'ส้ม-แดง', primary: '#f97316', secondary: '#ef4444' },
      { name: 'เขียว-เหลือง', primary: '#10b981', secondary: '#f59e0b' },
      { name: 'ฟ้า-ม่วง', primary: '#06b6d4', secondary: '#a855f7' },
      { name: 'แดง-ส้ม', primary: '#dc2626', secondary: '#f97316' }
    ];

    // Data storage
    let currentUser = null;
    let equipmentData = [];
    let repairRequests = [];
    let inspectionRecords = [];
    let userData = [];
    
    let currentImageFile = null;

    // State management
    let currentPage = 'login';
    let sidebarOpen = false;
    let editingEquipment = null;
    let editingUser = null;
    let filters = {
      name: '',
      code: '',
      type: '',
      responsible: '',
      room: '',
      status: 'ทุกสถานะ'
    };

    // Loading overlay
    function showLoading() {
      const overlay = document.createElement('div');
      overlay.id = 'loadingOverlay';
      overlay.className = 'loading-overlay';
      overlay.innerHTML = '<div class="spinner"></div>';
      document.body.appendChild(overlay);
    }

    function hideLoading() {
      const overlay = document.getElementById('loadingOverlay');
      if (overlay) overlay.remove();
    }

    // Google Apps Script API calls
    function loadConfig() {
      showLoading();
      google.script.run
        .withSuccessHandler(function(result) {
          if (result) {
            config = { ...defaultConfig, ...result };
          }
          hideLoading();
          render();
        })
        .withFailureHandler(function(error) {
          console.error('Load config error:', error);
          hideLoading();
          render();
        })
        .getConfig();
    }

    function saveConfig(newConfig) {
      showLoading();
      google.script.run
        .withSuccessHandler(function() {
          config = { ...config, ...newConfig };
          hideLoading();
          showToast('✅ บันทึกการตั้งค่าเรียบร้อยแล้ว', 'success');
          setTimeout(() => render(), 500);
        })
        .withFailureHandler(function(error) {
          console.error('Save config error:', error);
          hideLoading();
          showToast('❌ เกิดข้อผิดพลาดในการบันทึก', 'error');
        })
        .saveConfig(newConfig);
    }

    function loadAllData() {
      showLoading();
      google.script.run
        .withSuccessHandler(function(result) {
          userData = result.users || [];
          equipmentData = result.equipment || [];
          repairRequests = result.repairs || [];
          inspectionRecords = result.inspections || [];
          hideLoading();
          render();
        })
        .withFailureHandler(function(error) {
          console.error('Load data error:', error);
          hideLoading();
          showToast('❌ เกิดข้อผิดพลาดในการโหลดข้อมูล', 'error');
        })
        .getAllData();
    }

    function saveUser(userData) {
      showLoading();
      google.script.run
        .withSuccessHandler(function(result) {
          hideLoading();
          showToast(result.message, result.success ? 'success' : 'error');
          if (result.success) {
            editingUser = null;
            loadAllData();
          }
        })
        .withFailureHandler(function(error) {
          console.error('Save user error:', error);
          hideLoading();
          showToast('❌ เกิดข้อผิดพลาดในการบันทึก', 'error');
        })
        .saveUser(userData);
    }

    function removeUser(username) {
      showLoading();
      google.script.run
        .withSuccessHandler(function(result) {
          hideLoading();
          showToast(result.message, result.success ? 'success' : 'error');
          if (result.success) {
            loadAllData();
          }
        })
        .withFailureHandler(function(error) {
          console.error('Delete user error:', error);
          hideLoading();
          showToast('❌ เกิดข้อผิดพลาดในการลบ', 'error');
        })
        .deleteUser(username);
    }

    function saveEquipment(equipData) {
      showLoading();
      google.script.run
        .withSuccessHandler(function(result) {
          hideLoading();
          showToast(result.message, result.success ? 'success' : 'error');
          if (result.success) {
            currentImageFile = null;
            editingEquipment = null;
            navigateTo('reports');
            loadAllData();
          }
        })
        .withFailureHandler(function(error) {
          console.error('Save equipment error:', error);
          hideLoading();
          showToast('❌ เกิดข้อผิดพลาดในการบันทึก', 'error');
        })
        .saveEquipment(equipData);
    }

    function removeEquipment(id) {
  showLoading();
  google.script.run
    .withSuccessHandler(function(result) {
      hideLoading();
      showToast(result.message, result.success ? 'success' : 'error');
      if (result.success) {
        loadAllData(); // เพิ่มบรรทัดนี้ เพื่อรีเฟรชข้อมูลหลังลบ
      }
    })
    .withFailureHandler(function(error) {
      console.error('Delete equipment error:', error);
      hideLoading();
      showToast('❌ เกิดข้อผิดพลาดในการลบ', 'error');
    })
    .deleteEquipment(id);
}

    function saveRepairRequest(repairData) {
      showLoading();
      google.script.run
        .withSuccessHandler(function(result) {
          hideLoading();
          showToast(result.message, result.success ? 'success' : 'error');
          if (result.success) {
            document.getElementById('repairForm').reset();
            loadAllData();
          }
        })
        .withFailureHandler(function(error) {
          console.error('Save repair error:', error);
          hideLoading();
          showToast('❌ เกิดข้อผิดพลาดในการบันทึก', 'error');
        })
        .saveRepairRequest(repairData);
    }

    function updateRepairStatusData(repairId, newStatus) {
      showLoading();
      google.script.run
        .withSuccessHandler(function(result) {
          hideLoading();
          showToast(result.message, result.success ? 'success' : 'error');
          if (result.success) {
            loadAllData();
          }
        })
        .withFailureHandler(function(error) {
          console.error('Update repair status error:', error);
          hideLoading();
          showToast('❌ เกิดข้อผิดพลาดในการอัพเดท', 'error');
        })
        .updateRepairStatus(repairId, newStatus);
    }

    function saveInspectionRecord(inspectionData) {
      showLoading();
      google.script.run
        .withSuccessHandler(function(result) {
          hideLoading();
          showToast(result.message, result.success ? 'success' : 'error');
          if (result.success) {
            const modal = document.querySelector('.fixed.inset-0');
            if (modal) modal.remove();
            loadAllData();
          }
        })
        .withFailureHandler(function(error) {
          console.error('Save inspection error:', error);
          hideLoading();
          showToast('❌ เกิดข้อผิดพลาดในการบันทึก', 'error');
        })
        .saveInspectionRecord(inspectionData);
    }

    // File handling function
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // Render functions
    function render() {
      const app = document.getElementById('app');
      
      if (currentPage === 'login') {
        app.innerHTML = renderLogin();
        attachLoginListeners();
      } else {
        app.innerHTML = `
          ${renderSidebar()}
          <div class="flex-1 flex flex-col w-full overflow-hidden">
            ${renderHeader()}
            <main class="flex-1 overflow-y-auto p-4 md:p-6 w-full">
              ${renderCurrentPage()}
            </main>
          </div>
          ${sidebarOpen ? '<div class="fixed inset-0 bg-black bg-opacity-50 z-40 md:hidden" onclick="toggleSidebar()"></div>' : ''}
        `;
        attachEventListeners();
      }
    }

    function renderLogin() {
      const bgColor = config.primary_color || defaultConfig.primary_color;
      const accentColor = config.secondary_color || defaultConfig.secondary_color;
      const textColor = config.text_color || defaultConfig.text_color;
      
      return `
        <div class="w-full h-full flex items-center justify-center p-4" style="background: linear-gradient(135deg, ${bgColor} 0%, ${accentColor} 100%);">
          <div class="bg-white rounded-lg shadow-2xl p-8 w-full max-w-md">
            <div class="text-center mb-8">
              ${config.logo_url ? `
                <div class="mb-4 flex justify-center">
                  <img src="${config.logo_url}" alt="Logo" class="h-16 object-contain" onerror="this.style.display='none'">
                </div>
              ` : ''}
              <h1 class="text-3xl font-bold mb-2" style="color: ${textColor};">${config.system_name || defaultConfig.system_name}</h1>
              <p class="text-gray-600">${config.organization_name || defaultConfig.organization_name}</p>
            </div>
            
            <form id="loginForm" onsubmit="return false;">
              <div class="mb-4">
                <label for="username" class="block text-sm font-medium mb-2" style="color: ${textColor};">ชื่อผู้ใช้</label>
                <input type="text" id="username" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2" style="focus:ring-color: ${bgColor};" required>
              </div>
              
              <div class="mb-6">
                <label for="password" class="block text-sm font-medium mb-2" style="color: ${textColor};">รหัสผ่าน</label>
                <input type="password" id="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2" style="focus:ring-color: ${bgColor};" required>
              </div>
              
              <button type="submit" class="w-full text-white py-3 rounded-lg font-medium hover:opacity-90 transition-opacity" style="background-color: ${bgColor};">
                เข้าสู่ระบบ
              </button>
            </form>
          </div>
        </div>
      `;
    }

function renderSidebar() {
  const sidebarColor = config.sidebar_color || defaultConfig.sidebar_color;
  const secondaryColor = '#ffffff';

  return `
    <aside class="sidebar ${sidebarOpen ? 'open' : ''} w-64 h-full flex flex-col md:relative" style="background-color: ${sidebarColor};">
      <div class="p-6 border-b" style="border-color: rgba(255,255,255,0.2);">
        ${config.logo_url ? `
          <div class="mb-4 flex justify-center">
            <img src="${config.logo_url}" alt="Logo" class="h-20 object-contain" onerror="this.style.display='none'">
          </div>
        ` : ''}
        <h2 class="text-lg font-bold text-center mb-1" style="color: ${secondaryColor};">${config.system_name || defaultConfig.system_name}</h2>
        <p class="text-sm text-center opacity-90 mb-3" style="color: ${secondaryColor};">${config.organization_name || defaultConfig.organization_name}</p>
        <div class="text-center pt-3" style="border-top: 1px solid rgba(255,255,255,0.2);">
          <p class="text-xs opacity-75" style="color: ${secondaryColor};">ผู้ใช้งาน</p>
          <p class="text-sm font-medium" style="color: ${secondaryColor};">${currentUser?.name || ''}</p>
        </div>
      </div>
     
      <nav class="flex-1 p-4 overflow-y-auto">
        <button onclick="navigateTo('dashboard')" class="w-full text-left px-4 py-3 rounded-lg mb-2 transition-colors ${currentPage === 'dashboard' ? 'bg-white bg-opacity-20' : 'hover:bg-white hover:bg-opacity-10'}" style="color: ${secondaryColor};">
          📊 แดชบอร์ด
        </button>
        <button onclick="navigateTo('reports')" class="w-full text-left px-4 py-3 rounded-lg mb-2 transition-colors ${currentPage === 'reports' ? 'bg-white bg-opacity-20' : 'hover:bg-white hover:bg-opacity-10'}" style="color: ${secondaryColor};">
          📋 รายงาน
        </button>
        <button onclick="navigateTo('repair')" class="w-full text-left px-4 py-3 rounded-lg mb-2 transition-colors ${currentPage === 'repair' ? 'bg-white bg-opacity-20' : 'hover:bg-white hover:bg-opacity-10'}" style="color: ${secondaryColor};">
          🔧 แจ้งซ่อม
        </button>

        <!-- เมนูตรวจสอบครุภัณฑ์ - แสดงเฉพาะเมื่อเปิดใช้งาน -->
        ${config.inspection_menu_enabled ? `
          <button onclick="navigateTo('inspection')" class="w-full text-left px-4 py-3 rounded-lg mb-2 transition-colors ${currentPage === 'inspection' ? 'bg-white bg-opacity-20' : 'hover:bg-white hover:bg-opacity-10'}" style="color: ${secondaryColor};">
            📝 ตรวจสอบครุภัณฑ์ประจำปี
          </button>
        ` : ''}

        ${currentUser?.role === 'admin' ? `
          <button onclick="navigateTo('equipmentList')" class="w-full text-left px-4 py-3 rounded-lg mb-2 transition-colors ${currentPage === 'equipmentList' ? 'bg-white bg-opacity-20' : 'hover:bg-white hover:bg-opacity-10'}" style="color: ${secondaryColor};">
            📦 รายการครุภัณฑ์ทั้งหมด
          </button>
          <button onclick="navigateTo('repairManagement')" class="w-full text-left px-4 py-3 rounded-lg mb-2 transition-colors ${currentPage === 'repairManagement' ? 'bg-white bg-opacity-20' : 'hover:bg-white hover:bg-opacity-10'}" style="color: ${secondaryColor};">
            🔨 จัดการการซ่อม
          </button>
          <button onclick="navigateTo('add')" class="w-full text-left px-4 py-3 rounded-lg mb-2 transition-colors ${currentPage === 'add' ? 'bg-white bg-opacity-20' : 'hover:bg-white hover:bg-opacity-10'}" style="color: ${secondaryColor};">
            ➕ เพิ่มข้อมูล
          </button>
          <div class="my-2 pt-2" style="border-top: 1px solid rgba(255,255,255,0.2);">
            <button onclick="navigateTo('users')" class="w-full text-left px-4 py-3 rounded-lg mb-2 transition-colors ${currentPage === 'users' ? 'bg-white bg-opacity-20' : 'hover:bg-white hover:bg-opacity-10'}" style="color: ${secondaryColor};">
              👥 จัดการผู้ใช้
            </button>
            <button onclick="navigateTo('settings')" class="w-full text-left px-4 py-3 rounded-lg mb-2 transition-colors ${currentPage === 'settings' ? 'bg-white bg-opacity-20' : 'hover:bg-white hover:bg-opacity-10'}" style="color: ${secondaryColor};">
              ⚙️ ตั้งค่าระบบ
            </button>
          </div>
        ` : ''}
      </nav>
     
      <div class="p-4" style="border-top: 1px solid rgba(255,255,255,0.2);">
        <button onclick="logout()" class="w-full text-left px-4 py-3 rounded-lg hover:bg-white hover:bg-opacity-10 transition-colors" style="color: ${secondaryColor};">
          🚪 ออกจากระบบ
        </button>
      </div>
    </aside>
  `;
}

    function renderHeader() {
      const bgColor = '#ffffff';
      const textColor = config.text_color || defaultConfig.text_color;
      
      return `
        <header class="border-b p-4 md:p-6 flex items-center justify-between w-full" style="background-color: ${bgColor};">
          <div class="flex items-center gap-4">
            <button onclick="toggleSidebar()" class="md:hidden p-2 rounded-lg hover:bg-gray-100">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
              </svg>
            </button>
            <h1 class="text-xl md:text-2xl font-bold" style="color: ${textColor};">${getPageTitle()}</h1>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-sm" style="color: ${textColor};">${currentUser?.name || ''}</span>
            <div class="w-8 h-8 rounded-full flex items-center justify-center text-white font-medium" style="background-color: ${config.primary_color || defaultConfig.primary_color};">
              ${currentUser?.role === 'admin' ? 'A' : 'U'}
            </div>
          </div>
        </header>
      `;
    }

    function renderCurrentPage() {
      switch(currentPage) {
        case 'dashboard': return renderDashboard();
        case 'reports': return renderReports();
        case 'repair': return renderRepair();
        case 'inspection': return renderInspection();
        case 'equipmentList': return renderEquipmentList();
        case 'repairManagement': return renderRepairManagement();
        case 'add': return renderAddForm();
        case 'users': return renderUsers();
        case 'settings': return renderSettings();
        default: return renderDashboard();
      }
    }

    function renderDashboard() {
      let userEquipment = equipmentData;
      if (currentUser?.role === 'user') {
        userEquipment = equipmentData.filter(item => 
          item.owner === currentUser.username || item.responsible === currentUser.name
        );
      }
      
      const stats = calculateStats(userEquipment);
      const recentItems = userEquipment.slice(-5).reverse();
      
      const totalValue = userEquipment.reduce((sum, item) => {
      const price = parseFloat(item.price) || 0;
      const quantity = parseInt(item.quantity) || 1;
      return sum + (price * quantity);
      }, 0);
      const totalUsers = userData.length;
      const totalRepairs = repairRequests.length;
      const pendingRepairs = repairRequests.filter(r => r.status === 'รอดำเนินการ').length;
      const totalInspections = inspectionRecords.length;
      const thisYearInspections = inspectionRecords.filter(r => r.year === String(new Date().getFullYear() + 543)).length;
      
      return `
        <div class="space-y-6 w-full">
          <div class="grid grid-cols-2 md:grid-cols-5 gap-3 md:gap-4">
            ${renderStatCard('ทั้งหมด', stats.total, '📦', 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)')}
            ${renderStatCard('ใช้งานได้', stats.available, '✅', 'linear-gradient(135deg, #10b981 0%, #059669 100%)')}
            ${renderStatCard('รอซ่อม', stats.repair, '🔧', 'linear-gradient(135deg, #f59e0b 0%, #d97706 100%)')}
            ${renderStatCard('ชำรุด', stats.broken, '❌', 'linear-gradient(135deg, #ef4444 0%, #dc2626 100%)')}
            ${renderStatCard('จำหน่าย', stats.disposed, '📤', 'linear-gradient(135deg, #6b7280 0%, #4b5563 100%)')}
          </div>
          
          <div class="bg-white rounded-lg shadow-lg p-4 md:p-6">
            <h3 class="text-lg font-semibold mb-4" style="color: ${config.text_color || defaultConfig.text_color};">📊 สถิติการใช้งานระบบ</h3>
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
              <div class="bg-gradient-to-br from-blue-50 to-blue-100 p-4 rounded-lg shadow hover:shadow-md transition-shadow">
                <p class="text-xs text-gray-600 mb-1">👥 ผู้ใช้ทั้งหมด</p>
                <p class="text-2xl font-bold text-blue-600">${totalUsers}</p>
                <p class="text-xs text-gray-500 mt-1">คน</p>
              </div>
              
              <div class="bg-gradient-to-br from-green-50 to-green-100 p-4 rounded-lg shadow hover:shadow-md transition-shadow">
                <p class="text-xs text-gray-600 mb-1">📦 ครุภัณฑ์ทั้งหมด</p>
                <p class="text-2xl font-bold text-green-600">${userEquipment.length}</p>
                <p class="text-xs text-gray-500 mt-1">รายการ</p>
              </div>
              <div class="bg-gradient-to-br from-purple-50 to-purple-100 p-4 rounded-lg shadow hover:shadow-md transition-shadow">
  <p class="text-xs text-gray-600 mb-1">💰 มูลค่ารวม</p>
  <p class="text-2xl font-bold text-purple-600">

 let displayDate = '';

    let year = parts[2];

    // ถ้าเป็น พ.ศ. ให้แปลงเป็น ค.ศ.
    if (year.length === 4 && parseInt(year) > 2400) {

    if (!isNaN(dateObj.getTime())) {

    function renderPieChart(dataSet) {

      const total = Object.values(locationValues).reduce((a, b) => a + b, 0);

      return `
        <div class="flex flex-col h-full justify-center gap-3">
          ${Object.entries(locationValues).map(([location, value], index) => {
            const percentage = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
            return `

                <div class="w-4 h-4 rounded" style="background-color: ${colors[index % colors.length]};"></div>

    function handleDragOver(e) {
      e.preventDefault();
      e.stopPropagation();
      document.getElementById('uploadArea').classList.add('dragover');
    }

    function handleDragLeave(e) {
      e.preventDefault();
      e.stopPropagation();
      document.getElementById('uploadArea').classList.remove('dragover');
    }

    function handleDrop(e) {
      e.preventDefault();
      e.stopPropagation();
      document.getElementById('uploadArea').classList.remove('dragover');
      
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        processFile(files[0]);
      }
    }

    function handleFileSelect(e) {
      const files = e.target.files;
      if (files.length > 0) {
        processFile(files[0]);
      }
    }

    async function processFile(file) {
      const allowedTypes = ['image/jpeg', 'image/png', 'image/gif'];
      
      if (!allowedTypes.includes(file.type)) {
        showToast('❌ ประเภทไฟล์ไม่ถูกต้อง กรุณาเลือกไฟล์รูปภาพ (JPG, PNG, GIF)', 'error');
        return;
      }
      
      if (file.size > 5 * 1024 * 1024) {
        showToast('❌ ไฟล์มีขนาดใหญ่เกินไป (สูงสุด 5MB)', 'error');
        return;
      }
      
      currentImageFile = file;
      
      const uploadContent = document.getElementById('uploadContent');
      const uploadStatus = document.getElementById('uploadStatus');
      
      const reader = new FileReader();
      reader.onload = (e) => {
        uploadContent.innerHTML = `
          <img src="${e.target.result}" class="image-preview mx-auto mb-2" alt="Preview">
          <p class="text-sm text-gray-600">คลิกหรือลากไฟล์มาวางเพื่อเปลี่ยนรูป</p>
          <p class="text-xs text-green-600 mt-1">✓ ${file.name}</p>
        `;
      };
      reader.readAsDataURL(file);
      
      uploadStatus.innerHTML = '<span class="text-green-600">✓ ไฟล์พร้อมบันทึก</span>';
    }

function printReport() {
  let filteredData = equipmentData;

  // กรองตามสิทธิ์ผู้ใช้
  if (currentUser?.role === 'user') {
    filteredData = filteredData.filter(item =>
      item.owner === currentUser.username || item.responsible === currentUser.name
    );
  }

  // กรองตามตัวกรอง
  if (filters.name) filteredData = filteredData.filter(item => item.name.toLowerCase().includes(filters.name.toLowerCase()));
  if (filters.code) filteredData = filteredData.filter(item => item.id.includes(filters.code));
  if (filters.type && filters.type !== 'ทุกกลุ่มสาระ') filteredData = filteredData.filter(item => item.department === filters.type);
  if (filters.responsible) filteredData = filteredData.filter(item => item.responsible.toLowerCase().includes(filters.responsible.toLowerCase()));
  if (filters.room) filteredData = filteredData.filter(item => item.location.toLowerCase().includes(filters.room.toLowerCase()));
  if (filters.status !== 'ทุกสถานะ') filteredData = filteredData.filter(item => item.status === filters.status);

  // ฟังก์ชันแปลงราคาที่มี comma ให้เป็นตัวเลขถูกต้อง
  function getCleanPrice(priceValue) {
    if (!priceValue) return 0;
    const cleaned = String(priceValue).replace(/,/g, ''); // ลบ comma ทั้งหมด
    return parseFloat(cleaned) || 0;
  }

  // สร้างแถวข้อมูล
  const tableRows = filteredData.map((item, index) => {
    const price = getCleanPrice(item.price);
    const quantity = parseInt(item.quantity || 1) || 1;

    let sendRepair = '';
    let shouldDispose = '';

    if (['รอซ่อม', 'ชำรุด'].includes(item.status)) sendRepair = '✓';
    else if (item.status === 'ใช้งานไม่ได้') sendRepair = '';

    if (['รอจำหน่าย', 'จำหน่าย'].includes(item.status)) shouldDispose = '✓';

    return `<tr>
      <td style="text-align: center;">${index + 1}</td>
      <td>${item.id || '-'}</td>
      <td>${item.name || '-'}</td>
      <td style="text-align: center;">${item.date || '-'}</td>
      <td style="text-align: center;">${quantity}</td>
      <td style="text-align: center;">${item.unit || '-'}</td>
      <td style="text-align: right;">${price.toLocaleString('th-TH')}</td>
      <td>${item.budget || '-'}</td>
      <td>${item.location || '-'}</td>
      <td>${item.department || '-'}</td>
      <td style="text-align: center;">${item.status || '-'}</td>
      <td style="text-align: center; font-weight: bold;">${sendRepair}</td>
      <td style="text-align: center; font-weight: bold;">${shouldDispose}</td>
      <td>${item.responsible || '-'}</td>
    </tr>`;
  }).join('');

  // คำนวณมูลค่ารวมถูกต้อง
  const totalValue = filteredData.reduce((sum, item) => {
    const price = getCleanPrice(item.price);
    const quantity = parseInt(item.quantity || 1) || 1;
    return sum + (price * quantity);
  }, 0);

  const currentDate = new Date().toLocaleDateString('th-TH', { 
    year: 'numeric', month: 'long', day: 'numeric'

  const userName = currentUser?.name || '';
  const logoUrl = config.logo_url || '';

  const printWindow = window.open('', '_blank');
  if (!printWindow) {
    showToast('❌ กรุณาอนุญาต Popup', 'error');
    return;
  }

  printWindow.document.write(`

function printInspectionReport() {
  let filteredData = inspectionRecords;

  if (currentUser?.role === 'user') {
    filteredData = inspectionRecords.filter(rec => rec.owner === currentUser.username);
  }

  // สร้างรายชื่อผู้รับผิดชอบ
  const responsibleMap = {};
  filteredData.forEach(rec => {
    const equipment = equipmentData.find(eq => eq.id === rec.equipmentId);
    const responsible = equipment?.responsible || '-';
    if (!responsibleMap[responsible]) {
      responsibleMap[responsible] = { name: responsible, count: 0 };
    }
    responsibleMap[responsible].count++;
  });

  const sortedResponsible = Object.values(responsibleMap).sort((a, b) => b.count - a.count);
  const responsibleText = sortedResponsible.length > 0
    ? sortedResponsible.map((person, index) => `${index + 1}. ${person.name} (${person.count} รายการ)`).join(' • ')
    : 'ไม่มีข้อมูล';

  const currentDate = new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
  const orgName = config.organization_name || defaultConfig.organization_name;
  const userName = currentUser?.name || '';

  // แปลงราคาให้ถูกต้องโดยลบ comma ออกก่อน parse
function cleanPrice(priceStr) {
  if (!priceStr) return 0;
  // ถ้าเป็น string ที่มี comma เช่น "12,500" หรือ "1,234.56"
  const cleaned = String(priceStr).replace(/,/g, '');
  return parseFloat(cleaned) || 0;
}

// สร้างแถวข้อมูล
const tableRows = filteredData.map((item, index) => {
  const price = cleanPrice(item.price);
  const quantity = parseInt(item.quantity || 1) || 1;

  let sendRepair = '';
  let shouldDispose = '';

  if (['รอซ่อม', 'ชำรุด'].includes(item.status)) sendRepair = '✓';
  else if (item.status === 'ใช้งานไม่ได้') sendRepair = '';

  if (['รอจำหน่าย', 'จำหน่าย'].includes(item.status)) shouldDispose = '✓';

  return `<tr>
    <td style="text-align: center;">${index + 1}</td>
    <td>${item.id || '-'}</td>
    <td>${item.name || '-'}</td>
    <td style="text-align: center;">${item.date || '-'}</td>
    <td style="text-align: center;">${quantity}</td>
    <td style="text-align: center;">${item.unit || '-'}</td>
    <td style="text-align: right;">${price.toLocaleString('th-TH')}</td>
    <td>${item.budget || '-'}</td>
    <td>${item.location || '-'}</td>
    <td>${item.department || '-'}</td>
    <td style="text-align: center;">${item.status || '-'}</td>

    <td style="text-align: center; font-weight: bold;">${shouldDispose}</td>
    <td>${item.responsible || '-'}</td>
  </tr>`;
}).join('');

// คำนวณมูลค่ารวม (ใช้ cleanPrice เช่นกัน)

          <p class="text-gray-600 mb-6">คุณต้องการลบครุภัณฑ์ ${item.name} ใช่หรือไม่?</p>
          <div class="flex gap-3 justify-end">
            <button onclick="this.closest('.fixed').remove()" class="px-4 py-2 bg-gray-300 rounded-lg hover:bg-gray-400">
              ยกเลิก
            </button>
            <button onclick="confirmDelete('${id}')" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">
              ลบ
            </button>
          </div>
        </div>
      `;
      
      document.body.appendChild(confirmDiv);
    }

    function confirmDelete(id) {
      const confirmDiv = document.querySelector('.fixed.inset-0');
      if (confirmDiv) confirmDiv.remove();
      
      removeEquipment(id);
    }

    function cancelEdit() {
      editingEquipment = null;
      currentImageFile = null;
      navigateTo('reports');
    }

    function applyFilters() {
      filters.name = document.getElementById('filterName').value;
      filters.code = document.getElementById('filterCode').value;
      filters.type = document.getElementById('filterType').value;
      filters.responsible = document.getElementById('filterResponsible').value;
      filters.room = document.getElementById('filterRoom').value;
      filters.status = document.getElementById('filterStatus').value;
      render();
    }

    function clearFilters() {
      filters = {
        name: '',
        code: '',
        type: '',
        responsible: '',
        room: '',
        status: 'ทุกสถานะ'
      };
      render();
    }

    // Initialize
    loadConfig();
    loadAllData();
    render();
  </script>
 </body>
</html>
