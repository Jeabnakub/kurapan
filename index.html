<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบแสดงข้อมูลการรับเรื่องร้องเรียน/ร้องทุกข์</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
        body { font-family: 'Noto Sans Thai', sans-serif; }
        .glass-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.8);
        }
        .table-row:hover { background: #eff6ff; }
  </style>
</head>
<body class="min-h-screen bg-gray-50">
  <header class="bg-gradient-to-r from-blue-700 via-blue-600 to-blue-500 shadow-lg">
   <div class="max-w-7xl mx-auto px-4 py-5">
    <div class="flex items-center gap-3">
     <div class="bg-white/20 p-2 rounded-lg"><i data-lucide="file-text" class="w-7 h-7 text-white"></i></div>
     <div>
      <h1 id="page-title" class="text-white font-bold text-xl"></h1>
      <p id="page-subtitle" class="text-blue-100 text-sm"></p>
     </div>
    </div>
   </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
   <!-- Form Section -->
   <div class="glass-card rounded-xl shadow-md p-6 mb-6">
    <h2 id="form-heading" class="text-blue-800 font-semibold text-lg mb-4 flex items-center gap-2"></h2>
    <form id="complaint-form" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
     
     <div><label id="label-seq" for="seq" class="block text-sm font-medium text-gray-700 mb-1"></label> <input id="seq" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-400 outline-none" required></div>
     <div><label id="label-doc-num" for="docNum" class="block text-sm font-medium text-gray-700 mb-1"></label> <input id="docNum" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-400 outline-none" required></div>
     <div><label id="label-date" for="receiveDate" class="block text-sm font-medium text-gray-700 mb-1"></label> <input id="receiveDate" type="date" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-400 outline-none" required></div>
     
     <div class="md:col-span-2 lg:col-span-3"><label id="label-subject" for="subject" class="block text-sm font-medium text-gray-700 mb-1"></label> <input id="subject" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-400 outline-none" required></div>
     
     <div>
         <label id="label-officer" for="officer" class="block text-sm font-medium text-gray-700 mb-1"></label> 
         <select id="officer" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-400 outline-none" required> 
             <option value="">-- เลือกเจ้าหน้าที่ --</option> 
         </select>
     </div>
     <div>
         <label id="label-status" for="status" class="block text-sm font-medium text-gray-700 mb-1"></label> 
         <select id="status" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-400 outline-none" required> 
             <option value="">-- เลือกสถานะ --</option> 
             <option value="อยู่ระหว่างการตรวจสอบข้อมูล">อยู่ระหว่างการตรวจสอบข้อมูล</option> 
             <option value="ดำเนินการเรียบร้อยพบข้อมูลใน ework ถูกต้อง">ดำเนินการเรียบร้อยพบข้อมูลใน ework ถูกต้อง</option> 
             <option value="ดำเนินการเสร็จสิ้น">ดำเนินการเสร็จสิ้น</option> 
         </select>
     </div>
     <div><label id="label-datetime" for="thaiDatetime" class="block text-sm font-medium text-gray-700 mb-1"></label> <input id="thaiDatetime" type="text" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm bg-gray-50 text-gray-600" readonly></div>
     
     <!-- แนบรูปภาพ -->
     <div class="md:col-span-2 lg:col-span-3">
        <label class="block text-sm font-medium text-gray-700 mb-1 flex items-center gap-2">
            <i data-lucide="image" class="w-4 h-4"></i> แนบรูปภาพประกอบ (ถ้ามี)
        </label>
        <input id="imageFile" type="file" accept="image/*" 
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm file:mr-4 file:py-1 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        <div id="image-preview" class="mt-2 hidden">
            <img id="preview-img" src="" class="h-32 rounded-lg border shadow-sm object-contain">
        </div>
     </div>

     <div class="md:col-span-2 lg:col-span-3"><label id="label-remark" for="remark" class="block text-sm font-medium text-gray-700 mb-1"></label> <textarea id="remark" rows="2" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-400 outline-none"></textarea></div>
     
     <div class="md:col-span-2 lg:col-span-3 flex justify-end">
         <button id="submit-btn" type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2.5 rounded-lg shadow transition flex items-center gap-2">
             <i data-lucide="save" class="w-4 h-4"></i> บันทึกข้อมูล
         </button>
     </div>
    </form>
   </div>

   <!-- Table Section -->
   <div class="glass-card rounded-xl shadow-md overflow-hidden">
    <div class="bg-blue-50 px-6 py-3 border-b border-blue-100">
     <h2 id="table-heading" class="text-blue-800 font-semibold flex items-center gap-2"></h2>
    </div>
    <div class="overflow-x-auto">
     <table class="w-full text-sm">
      <thead class="bg-blue-600 text-white">
       <tr>
        <th class="px-3 py-3 text-left font-medium">ลำดับที่</th>
        <th class="px-3 py-3 text-left font-medium">เลขรับสบต</th>
        <th class="px-3 py-3 text-left font-medium">วันที่รับ</th>
        <th class="px-3 py-3 text-left font-medium">เรื่อง</th>
        <th class="px-3 py-3 text-left font-medium">ผู้รับผิดชอบ</th>
        <th class="px-3 py-3 text-left font-medium">สถานะ</th>
        <th class="px-3 py-3 text-left font-medium">วันเวลาแจ้งสถานะ</th>
        <th class="px-3 py-3 text-left font-medium">รูปภาพ</th>
       </tr>
      </thead>
      <tbody id="table-body">
       <tr>
        <td colspan="8" class="px-4 py-8 text-center text-gray-400"><p id="empty-table"></p></td>
       </tr>
      </tbody>
     </table>
    </div>
   </div>
  </main>

  <script>
        // 1. กำหนด URL ของ Google Apps Script ที่ได้จากการ Deploy เป็น Web App
        const SCRIPT_URL = 'ใส่_URL_WEB_APP_ที่นี่'; 

        // 2. ใส่ข้อความ UI
        const uiText = {
            "page-title": "ระบบบันทึกสถานะเรื่องร้องเรียน/ร้องทุกข์",
            "page-subtitle": "ส่วนตรวจสอบและปฏิบัติการ - สำนักติดตามและประเมินผล",
            "form-heading": "กรอกข้อมูลสถานะการดำเนินงาน",
            "label-seq": "ลำดับที่",
            "label-doc-num": "เลขรับ สบต.",
            "label-date": "วันที่รับเรื่อง",
            "label-subject": "เรื่อง/ประเด็นร้องเรียน",
            "label-officer": "เจ้าหน้าที่ผู้รับผิดชอบ",
            "label-status": "สถานะการดำเนินงาน",
            "label-datetime": "วันเวลาที่บันทึก (ระบบ)",
            "label-remark": "หมายเหตุเพิ่มเติม",
            "table-heading": "รายการที่บันทึกแล้ว (Session ปัจจุบัน)",
            "empty-table": "ยังไม่มีข้อมูลการบันทึกในขณะนี้"
        };
        Object.entries(uiText).forEach(([id, text]) => {
            const el = document.getElementById(id);
            if (el) el.textContent = text;
        });

        // 3. จัดการรายชื่อเจ้าหน้าที่
        const females = [
            'นางสาวฐิติวรดา อินทร์ประสิทธิ์','นางสาวพิมพ์นภัส กลิ่นบัว','นางสาวมณฑกานต์ แจ่มใจ',
            'นางสาวกานต์พิชชา พิมพ์งาม','นางสาวกุลธิรัตน์ ทีปพรรธน์ธนา','นางสาวนันทวรรณ บุญเหม',
            'นางสาวเมขลา อุดมสิริสถาพร','นางสาวนภาภรณ์ สุขเกษม','นางสาวพัชราภา สุทธิอาจ',
            'นางสาวภาณุมาศ สาลีนาค','นางสาวศิริปรมินทร์ ขันติคเชนชาติ','นางสุมาลี รักไทย',
            'นางสาวกนกพร ภูชะหาร','นางสาวธมกร พิมพ์งาม','นางสาวนุศรา กลิ่นจุน','นางสาวพรพัสตร์ ช่วยบำรุง'
        ];
        const males = [
            'นายปโยธร พลกรณ์','นายพงศกร โพธิเย็น','นายพงศ์พิพัฒน์ อยู่ทองจุ้ย',
            'นายสุเมธ ยิ้มพงษ์','นายชุมพร บุญเหลี่ยม','นายธณินทร ทัศนา'
        ];
        const officerSelect = document.getElementById('officer');
        const optGroupF = document.createElement('optgroup'); optGroupF.label = '👩 หญิง';
        females.forEach(n => { const o = document.createElement('option'); o.value = n; o.textContent = n; optGroupF.appendChild(o); });
        const optGroupM = document.createElement('optgroup'); optGroupM.label = '👨 ชาย';
        males.forEach(n => { const o = document.createElement('option'); o.value = n; o.textContent = n; optGroupM.appendChild(o); });
        officerSelect.appendChild(optGroupF); officerSelect.appendChild(optGroupM);

        // 4. อัปเดตเวลา
        function updateThaiDatetime() {
            const opts = { year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit', timeZone:'Asia/Bangkok' };
            document.getElementById('thaiDatetime').value = new Date().toLocaleDateString('th-TH', opts);
        }
        updateThaiDatetime(); setInterval(updateThaiDatetime, 1000);

        // 5. พรีวิวและแปลงไฟล์รูปเป็น Base64
        document.getElementById('imageFile').addEventListener('change', function(e) {
            const reader = new FileReader();
            const preview = document.getElementById('image-preview');
            const previewImg = document.getElementById('preview-img');
            reader.onload = function(e) {
                previewImg.src = e.target.result;
                preview.classList.remove('hidden');
            }
            if (this.files[0]) reader.readAsDataURL(this.files[0]);
            else preview.classList.add('hidden');
        });

        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // 6. บันทึกและส่งข้อมูล
        const records = [];
        function renderTable() {
            const tbody = document.getElementById('table-body');
            if (records.length === 0) return;
            tbody.innerHTML = records.map(r => `
                <tr class="table-row border-b border-gray-100">
                    <td class="px-3 py-2.5">${r.seq}</td>
                    <td class="px-3 py-2.5">${r.docNum}</td>
                    <td class="px-3 py-2.5">${r.receiveDate}</td>
                    <td class="px-3 py-2.5">${r.subject}</td>
                    <td class="px-3 py-2.5">${r.officer}</td>
                    <td class="px-3 py-2.5"><span class="inline-block px-2 py-0.5 rounded-full text-xs font-medium ${r.status === 'ดำเนินการเสร็จสิ้น' ? 'bg-green-100 text-green-700' : r.status === 'ดำเนินการเรียบร้อยพบข้อมูลใน ework ถูกต้อง' ? 'bg-blue-100 text-blue-700' : 'bg-yellow-100 text-yellow-700'}">${r.status}</span></td>
                    <td class="px-3 py-2.5 text-xs text-gray-500">${r.thaiDatetime}</td>
                    <td class="px-3 py-2.5">${r.image ? `<a href="#" class="text-blue-500 underline text-xs">มีรูปแนบ</a>` : '-'}</td>
                </tr>
            `).join('');
        }

        document.getElementById('complaint-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            Swal.fire({ title: 'กำลังเตรียมข้อมูล...', text: 'กรุณารอสักครู่', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            
            const fileInput = document.getElementById('imageFile');
            let imageData = "";
            if (fileInput.files.length > 0) imageData = await getBase64(fileInput.files[0]);

            const data = {
                seq: document.getElementById('seq').value,
                docNum: document.getElementById('docNum').value,
                receiveDate: document.getElementById('receiveDate').value,
                subject: document.getElementById('subject').value,
                officer: document.getElementById('officer').value,
                status: document.getElementById('status').value,
                thaiDatetime: document.getElementById('thaiDatetime').value,
                remark: document.getElementById('remark').value,
                image: imageData
            };

            try {
                // ส่งข้อมูลด้วย POST เพื่อรองรับขนาดไฟล์ภาพ
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(data),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' } // ใช้ text/plain เพื่อเลี่ยง CORS preflight
                });

                const result = await response.json();
                
                if (result.status === 'success') {
                    records.push(data);
                    renderTable();
                    this.reset();
                    document.getElementById('image-preview').classList.add('hidden');
                    updateThaiDatetime();
                    Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ!', text: 'ข้อมูลและรูปภาพถูกบันทึกเรียบร้อยแล้ว', timer: 2000, showConfirmButton: false });
                } else {
                    throw new Error(result.message || 'Unknown Error');
                }
            } catch (err) {
                console.error(err);
                Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: 'ไม่สามารถบันทึกข้อมูลได้ กรุณาตรวจสอบ URL หรือการเชื่อมต่อ' });
            }
        });

        lucide.createIcons();
  </script>
</body>
</html>
